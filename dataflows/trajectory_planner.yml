# Closed loop with a trajectory planner: one node publishes the executable Trajectory
# itself (planning.trajectory_planner.type: a learned planner such as a Diffusion
# Planner, lane_follow, or path_pipeline = path planner + trajectory generation).
# Everything else is closed_loop.yml: the runner composes the two (extends / remove /
# rewire), so components added there are part of this dataflow too.
extends: closed_loop.yml
remove: [planner, trajectory_generator]
rewire:
  planner: trajectory_planner
  trajectory_generator: trajectory_planner

nodes:
  - id: trajectory_planner
    path: ${PYTHON}
    args: -m doraware.planning.trajectory_planning.node
    restart_policy: on-failure     # the scenario manager re-sends the request after a restart
    max_restarts: 2
    inputs:
      planning_request: {source: scenario_manager/planning_request, queue_size: 10}
      vehicle_state: {source: sim_bridge/vehicle_state, queue_size: 100000}
      # perception (ground truth until a perception node exists); used only by plugins that declare it
      objects: {source: sim_bridge/ground_truth_objects, queue_size: 100000}
    outputs: [trajectory, planning_result, trajectory_status, diagnostics]
