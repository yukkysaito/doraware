# Lane following on roads (overlay on default.yaml):
#   doraware run --config configs/road.yaml --scenario R3 --gui
# A trajectory planner (lane_follow) gets the lane map and the route from the planning
# request and the objects (simulator ground truth) as a declared input.
dataflow: dataflows/trajectory_planner.yml

planning:
  trajectory_planner:
    type: lane_follow             # parameters: planning.trajectory_planner.lane_follow in default.yaml
  trajectory_generation:
    max_forward_speed: 2.5        # [m/s] (the lanes' speed limit is 3 m/s; kinematic MPC domain)
    max_acceleration: 0.8
    max_deceleration: 0.8
  signals:
    policy: turn_indicators       # driving among traffic: indicate turns, hazard only without a plan

evaluation:
  scenario_source: road
