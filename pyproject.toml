[project]
name = "doraware"
version = "0.1.0"
description = "Modular autonomous-driving platform on Dora with deterministic closed-loop simulation and evaluation"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["autonomous driving", "dora", "motion planning", "model predictive control", "simulation", "godot"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "dora-rs==1.1.0",
  "dora-rs-cli==1.1.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "osqp==1.1.3",
  "pyarrow==26.0.0",
  "pyyaml>=6.0",
  "mcap==1.6.0",
  "shapely==2.2.0",
  "numba==0.68.1",
  "matplotlib==3.11.2",
]

[project.urls]
Repository = "https://github.com/yukkysaito/doraware"
Documentation = "https://github.com/yukkysaito/doraware/tree/main/docs"
Issues = "https://github.com/yukkysaito/doraware/issues"

[project.scripts]
doraware = "doraware.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "godot: requires the Godot binary (integration)",
  "e2e: full Dora + Godot closed-loop run (slow)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W"]
# B008: dataclass-style default configs in tests; B023: closures used immediately inside the loop;
# B905: zip() over arrays of equal length by construction; E731/E741: math-style short names (l/u bounds)
ignore = ["B008", "B023", "B905", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/doraware/interfaces/__init__.py" = ["F403", "F405"]
